name: Atualização Semanal das Leis (Planalto)

on:
  schedule:
    # Executa todo domingo à meia-noite (00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-laws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Extrair Leis e Gerar Banco SQLite
        run: |
          python scripts/extract_laws.py

      - name: Verificar Alterações e Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/juridireader.db
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada nas leis do Planalto."
          else
            git commit -m "chore(laws): atualização automática das leis do Planalto [skip ci]"
            git push
          fi
